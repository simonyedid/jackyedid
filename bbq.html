<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbecue — Jack Yedid</title>
  <meta name="description" content="Cook a barbecue on Jack Yedid's website.">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <link rel="stylesheet" href="style.css?v=26">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📽️</text></svg>">
</head>
<body>

  <header class="hero">
    <h1>🍖 <span class="name">Barbecue</span></h1>
    <p class="tagline">Cook it just right. Don't burn it!</p>
  </header>

  <main>

    <section class="card">
      <h2>🔥 The grill</h2>
      <!-- The six cooking spots get made by bbq.js -->
      <div class="grill" id="grill"></div>
      <p class="bbq-message" id="message">Pick some food, then tap an empty spot on the grill.</p>
    </section>

    <section class="card">
      <h2>🥩 What are you cooking?</h2>
      <div class="picker" id="food-picker"></div>
    </section>

    <section class="card">
      <h2>🏆 Score</h2>
      <p class="bbq-score" id="score">Served 0 · Perfect 0 · Best 0</p>
      <button id="clear-grill">🧹 Clear the grill</button>
    </section>

    <section class="card" id="lunch-box">
      <h2>📦 My Lunch Box</h2>
      <p class="album-message" id="lunch-message"></p>
      <!-- Everything you cook perfectly goes in here. -->
      <div class="food-box" id="lunch"></div>
      <button id="empty-lunch">🗑️ Empty the lunch box</button>
    </section>

    <p class="back-link"><a href="index.html">← Back to my website</a></p>

  </main>

  <footer>
    <p>Made by Jack Yedid 📽️ jackyedid.com</p>
  </footer>

  <script src="bbq.js?v=2"></script>
  <script src="music.js?v=3"></script>
</body>
</html>
