<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Sticker Book — Jack Yedid</title>
  <meta name="description" content="Jack Yedid's sticker book.">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <link rel="stylesheet" href="style.css?v=45">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📽️</text></svg>">
</head>
<body>

  <header class="hero">
    <h1>📒 <span class="name">Sticker</span> Book</h1>
  </header>

  <main>

    <section class="card">
      <!-- The book. It starts shut. Press the cover to open it. -->
      <div class="book" id="book">

        <button class="book-cover" id="cover">
          <span class="cover-picture">📒</span>
          <span class="cover-title">My Sticker Book</span>
          <span class="cover-by">by Jack Yedid</span>
          <span class="cover-open">Press to open →</span>
        </button>

        <div class="book-page" id="page" hidden>
          <div class="page-slots" id="slots"></div>
          <p class="page-empty-note" id="page-empty-note" hidden>
            Empty! Play games to earn stickers.
          </p>

          <!-- What you write on this page. -->
          <label class="page-writing-label" for="page-writing">✏️ What I want to say about this page:</label>
          <textarea id="page-writing" class="page-writing" rows="2" maxlength="140"
                    placeholder="Write something here..."></textarea>

          <!-- The keyboard you tap to write with. keyboard.js makes the keys. -->
          <div class="keyboard" id="keyboard"></div>

          <div class="page-bottom">
            <button id="page-back">◀ Back page</button>
            <span class="page-number" id="page-number"></span>
            <button id="page-next">Next page ▶</button>
          </div>
          <button class="book-shut" id="shut">Close my book</button>
        </div>

      </div>
    </section>

    <section class="card">
      <h2>⭐ How am I doing?</h2>
      <p class="album-message" id="progress"></p>
      <p class="game-help" id="still-to-play"></p>
    </section>

    <p class="back-link"><a href="index.html">← Back to my website</a></p>

  </main>

  <footer>
    <p>Made by Jack Yedid 📽️ jackyedid.com</p>
  </footer>

  <script src="stars.js?v=4"></script>
  <script src="stickers.js?v=5"></script>
  <script src="keyboard.js?v=4"></script>
  <script src="music.js?v=3"></script>
</body>
</html>
