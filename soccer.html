<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penalty Shootout — Jack Yedid</title>
  <meta name="description" content="Take penalties on Jack Yedid's website.">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <link rel="stylesheet" href="style.css?v=45">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📽️</text></svg>">
</head>
<body>

  <header class="hero">
    <h1>⚽ <span class="name">Penalty</span> Shootout</h1>
    <p class="tagline">5 shots. Can you beat the keeper?</p>
  </header>

  <main>

    <section class="card">
      <!-- The pitch gets drawn on here. Click it to shoot! -->
      <canvas id="pitch" width="500" height="400" class="pitch"></canvas>

      <p class="game-help">
        <strong>Click</strong> or <strong>tap</strong> the spot in the goal you
        want to hit. Aim for the corners — that is where the keeper is slowest!
      </p>

      <button id="kick-off-button">⚽ Start shooting</button>
    </section>

    <p class="back-link"><a href="index.html">← Back to my website</a></p>

  </main>

  <footer>
    <p>Made by Jack Yedid 📽️ jackyedid.com</p>
  </footer>

  <script src="soccer.js?v=4"></script>
  <script src="stars.js?v=4"></script>
  <script src="music.js?v=3"></script>
</body>
</html>
