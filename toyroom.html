<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Toy Room — Jack Yedid</title>
  <meta name="description" content="Jack Yedid's toy room, with every prize there is to win.">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <link rel="stylesheet" href="style.css?v=42">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📽️</text></svg>">
</head>
<body>

  <header class="hero">
    <h1>🚪 <span class="name">Toy</span> Room</h1>
    <p class="tagline">Every toy there is. The dark ones you have not won yet.</p>
  </header>

  <main>

    <!-- The room. Wall at the top with shelves on it, floor at the
         bottom with a rug and a table for the big prize. -->
    <section class="card room-card">
      <div class="room">

        <div class="wall">
          <div class="window"><span class="sun">☀️</span></div>

          <p class="wall-sign">🧸 Toys <span id="toy-count"></span></p>
          <div class="shelf-items" id="toy-shelves"></div>

          <p class="wall-sign">📒 Stickers <span id="sticker-count"></span></p>
          <div class="shelf-items" id="sticker-shelves"></div>
        </div>

        <div class="floor">
          <div class="rug"></div>
          <div class="table">
            <div class="big-prize" id="big-prize"></div>
            <!-- The table it stands on: a top, then two legs. -->
            <div class="table-top"></div>
            <div class="table-legs"></div>
          </div>
        </div>

      </div>

      <p class="album-message" id="big-prize-words"></p>
    </section>

    <p class="back-link">
      <a href="stickers.html">📒 My sticker book</a> ·
      <a href="index.html">← Back to my website</a>
    </p>

  </main>

  <footer>
    <p>Made by Jack Yedid 📽️ jackyedid.com</p>
  </footer>

  <script src="stars.js?v=4"></script>
  <script src="toyroom.js?v=3"></script>
  <script src="music.js?v=3"></script>
</body>
</html>
